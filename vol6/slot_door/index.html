<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かけざんスロット(最終回)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181614;
    --paper:#f2ede4;
    --team-a:#1e8fd5;
    --team-a-dark:#125e8c;
    --team-b:#e8395a;
    --team-b-dark:#a3213a;
    --gold:#f2b705;
    --dice:#34d399;
    --line:#181614;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--ink);
    background-image:
      radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:14px 14px;
    color:var(--paper);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .title{
    font-family:'Reggae One', sans-serif;
    font-size:clamp(28px, 5vw, 44px);
    letter-spacing:0.04em;
    color:var(--gold);
    text-shadow:3px 3px 0 var(--ink), 3px 3px 0 rgba(0,0,0,0.6);
    -webkit-text-stroke:1.5px var(--ink);
    margin:4px 0 22px;
    text-align:center;
  }

  .topbar{
    width:100%;
    max-width:920px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-bottom:8px;
  }

  .ghost-btn{
    background:transparent;
    border:2px solid rgba(242,237,228,0.35);
    color:var(--paper);
    font-family:inherit;
    font-size:13px;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color 0.15s, color 0.15s;
  }
  .ghost-btn:hover:not(:disabled){border-color:var(--gold); color:var(--gold);}
  .ghost-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .ghost-btn:disabled{opacity:0.3; cursor:not-allowed;}

  /* 設定パネル */
  .settings{
    width:100%;
    max-width:920px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
    font-size:13px;
    background:rgba(255,255,255,0.03);
    border:2px solid rgba(242,237,228,0.15);
    border-radius:10px;
    padding:16px;
  }
  .settings.open{display:flex;}
  .settings-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .settings input[type="number"]{
    width:70px;
    font-family:inherit;
    font-size:14px;
    padding:4px 8px;
    border-radius:6px;
    border:2px solid var(--line);
    text-align:center;
  }
  .roster-row{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .roster-row label{
    font-family:'Reggae One', sans-serif;
    font-size:13px;
    width:20px;
    text-align:center;
  }
  .roster-row input[type="text"]{
    width:120px;
    font-family:inherit;
    font-size:14px;
    padding:5px 8px;
    border-radius:6px;
    border:2px solid var(--line);
  }

  /* 対戦カード選択 */
  .matchup{
    width:100%;
    max-width:760px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .matchup-select{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .matchup-select span{
    font-size:11px;
    color:rgba(242,237,228,0.5);
  }
  .matchup select{
    font-family:'Reggae One', sans-serif;
    font-size:16px;
    padding:8px 14px;
    border-radius:8px;
    border:2px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
  }
  #matchupLeft{border-color:var(--team-a);}
  #matchupRight{border-color:var(--team-b);}
  .matchup-vs{
    font-family:'Reggae One', sans-serif;
    font-size:15px;
    color:rgba(242,237,228,0.5);
    margin-top:16px;
  }

  /* お題カード */
  .odai-card{
    width:100%;
    max-width:760px;
    background:var(--paper);
    color:var(--ink);
    border:3px solid var(--ink);
    border-radius:10px;
    padding:22px 26px;
    box-shadow:6px 6px 0 rgba(0,0,0,0.55);
    margin-bottom:26px;
    position:relative;
  }
  .odai-label{
    position:absolute;
    top:-13px;
    left:20px;
    background:var(--gold);
    color:var(--ink);
    font-size:12px;
    padding:2px 12px;
    border-radius:999px;
    border:2px solid var(--ink);
    font-weight:700;
  }
  #odaiText{
    width:100%;
    border:none;
    background:transparent;
    resize:none;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:clamp(18px, 3.4vw, 26px);
    line-height:1.5;
    color:var(--ink);
    text-align:center;
    padding:4px 0 0;
  }
  #odaiText:focus{outline:none;}
  #odaiText::placeholder{color:#8a8378;}

  /* アリーナ */
  .arena{
    width:100%;
    max-width:920px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:16px;
    align-items:start;
  }
  @media (max-width:680px){
    .arena{grid-template-columns:1fr; }
    .vs-mark{order:2; margin:6px auto;}
    .panel.teamB{order:3;}
  }

  .vs-mark{
    align-self:center;
    font-family:'Reggae One', sans-serif;
    font-size:28px;
    color:var(--paper);
    background:var(--ink);
    border:3px solid var(--paper);
    width:56px;height:56px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin-top:70px;
  }

  .panel{
    position:relative;
    border:3px solid var(--line);
    border-radius:10px;
    padding:16px;
    background:#1f1c19;
    transition:transform 0.12s, box-shadow 0.12s;
    overflow:hidden;
  }
  .panel.flash{
    animation:hit 0.35s ease;
  }
  @keyframes hit{
    0%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    50%{transform:translateX(6px);}
    75%{transform:translateX(-3px);}
    100%{transform:translateX(0);}
  }

  .dmg-popup{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.5);
    opacity:0;
    pointer-events:none;
    text-align:center;
    z-index:5;
    white-space:nowrap;
  }
  .dmg-popup.show{
    animation:dmgpop 1.3s ease forwards;
  }
  .dmg-popup .calc{
    display:block;
    font-family:'Reggae One', sans-serif;
    font-size:20px;
    color:var(--paper);
    text-shadow:2px 2px 0 rgba(0,0,0,0.7);
  }
  .dmg-popup .calc .p-power{color:var(--gold);}
  .dmg-popup .calc .p-dice{color:var(--dice);}
  .dmg-popup .total{
    display:block;
    font-family:'Reggae One', sans-serif;
    font-size:42px;
    color:var(--gold);
    text-shadow:2px 2px 0 rgba(0,0,0,0.8);
    margin-top:2px;
  }
  @keyframes dmgpop{
    0%{opacity:0; transform:translate(-50%,-40%) scale(0.4);}
    18%{opacity:1; transform:translate(-50%,-50%) scale(1.15);}
    32%{transform:translate(-50%,-50%) scale(1);}
    78%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-68%) scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .dmg-popup.show{animation:none; opacity:1;}
  }

  .panel.teamA{border-color:var(--team-a); box-shadow:0 0 0 3px rgba(30,143,213,0.15);}
  .panel.teamB{border-color:var(--team-b); box-shadow:0 0 0 3px rgba(232,57,90,0.15);}

  .team-name{
    width:100%;
    border-bottom:2px dashed rgba(242,237,228,0.3);
    font-family:'Reggae One', sans-serif;
    font-size:20px;
    padding:2px 0 6px;
    margin-bottom:10px;
    text-align:center;
  }
  .teamA .team-name{color:var(--team-a);}
  .teamB .team-name{color:var(--team-b);}

  .score-num{
    font-family:'Reggae One', sans-serif;
    font-size:44px;
    text-align:center;
    margin:2px 0 8px;
  }
  .teamA .score-num{color:var(--team-a);}
  .teamB .score-num{color:var(--team-b);}

  .hp-track{
    width:100%;
    height:14px;
    background:rgba(255,255,255,0.08);
    border:2px solid var(--line);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .hp-fill{
    height:100%;
    transition:width 0.4s ease;
  }
  .teamA .hp-fill{background:linear-gradient(90deg, var(--team-a-dark), var(--team-a));}
  .teamB .hp-fill{background:linear-gradient(90deg, var(--team-b-dark), var(--team-b));}

  .atk-label{
    font-size:12px;
    color:rgba(242,237,228,0.6);
    text-align:center;
    margin-bottom:8px;
  }

  .atk-row{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:8px;
  }
  .atk-btn{
    font-family:'Reggae One', sans-serif;
    font-size:24px;
    padding:14px 0;
    border-radius:10px;
    border:2px solid var(--line);
    cursor:pointer;
    background:var(--paper);
    color:var(--ink);
    transition:transform 0.08s, background 0.15s, box-shadow 0.15s;
  }
  .atk-btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:3px 3px 0 rgba(0,0,0,0.35);}
  .atk-btn:active:not(:disabled){transform:translateY(1px); box-shadow:none;}
  .atk-btn:focus-visible{outline:3px solid var(--gold); outline-offset:1px;}
  .teamA .atk-btn:hover:not(:disabled){background:var(--team-a); color:var(--paper);}
  .teamB .atk-btn:hover:not(:disabled){background:var(--team-b); color:var(--paper);}
  .atk-btn:disabled{opacity:0.35; cursor:not-allowed;}

  /* ログ */
  .log-wrap{
    width:100%;
    max-width:920px;
    margin-top:22px;
  }
  .log-title{
    font-size:12px;
    color:rgba(242,237,228,0.5);
    margin-bottom:6px;
    padding-left:2px;
  }
  #log{
    list-style:none;
    margin:0; padding:0;
    max-height:280px;
    overflow-y:auto;
    border:2px solid rgba(242,237,228,0.15);
    border-radius:8px;
  }
  #log li{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    column-gap:8px;
    padding:14px 16px;
    font-size:16px;
    line-height:1.6;
    border-left:5px solid transparent;
    border-bottom:1px solid rgba(242,237,228,0.1);
    background:rgba(255,255,255,0.02);
  }
  #log li:nth-child(even){background:rgba(255,255,255,0.045);}
  #log li:last-child{border-bottom:none;}
  #log li.from-a{border-left-color:var(--team-a);}
  #log li.from-b{border-left-color:var(--team-b);}
  #log .log-name{font-weight:700;}
  #log .log-name.teamA-text{color:var(--team-a);}
  #log .log-name.teamB-text{color:var(--team-b);}
  #log .log-plain{color:rgba(242,237,228,0.75);}
  #log .log-power, #log .log-dice, #log .log-total{
    font-family:'Reggae One', sans-serif;
    font-size:19px;
  }
  #log .log-power{color:var(--gold);}
  #log .log-dice{color:var(--dice);}
  #log .log-total{color:var(--paper);}
  #log .log-arrow{color:rgba(242,237,228,0.4); margin:0 2px;}
  #log:empty::after{
    content:"まだ攻撃はありません";
    display:block;
    padding:14px;
    font-size:13px;
    color:rgba(242,237,228,0.4);
  }

  /* 勝敗オーバーレイ */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10;
  }
  .overlay.show{display:flex;}
  .win-card{
    background:var(--gold);
    color:var(--ink);
    border:4px solid var(--ink);
    border-radius:14px;
    padding:34px 44px;
    text-align:center;
    box-shadow:8px 8px 0 rgba(0,0,0,0.6);
  }
  .win-card .win-label{
    font-size:13px;
    letter-spacing:0.1em;
    margin-bottom:6px;
  }
  .win-card .win-name{
    font-family:'Reggae One', sans-serif;
    font-size:34px;
    margin-bottom:18px;
  }
  .win-card button{
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    padding:10px 26px;
    border-radius:999px;
    border:2px solid var(--ink);
    background:var(--ink);
    color:var(--gold);
    cursor:pointer;
  }
</style>
</head>
<body>

  <div class="topbar">
    <button class="ghost-btn" id="settingsToggle" type="button">設定</button>
    <button class="ghost-btn" id="undoBtn" type="button" disabled>一つ戻る</button>
    <button class="ghost-btn" id="resetBtn" type="button">リセット</button>
  </div>

  <div class="settings" id="settingsPanel">
    <div class="settings-row">
      <label for="initScore">初期得点</label>
      <input type="number" id="initScore" min="1" max="100" value="100">
      <span style="color:rgba(242,237,228,0.5);">（リセット時に反映されます）</span>
    </div>
    <div class="settings-row">
      <div class="roster-row"><label>A</label><input type="text" class="roster-input" data-team="A" value="チームA"></div>
      <div class="roster-row"><label>B</label><input type="text" class="roster-input" data-team="B" value="チームB"></div>
      <div class="roster-row"><label>C</label><input type="text" class="roster-input" data-team="C" value="チームC"></div>
      <div class="roster-row"><label>D</label><input type="text" class="roster-input" data-team="D" value="チームD"></div>
    </div>
  </div>

  <div class="matchup">
    <div class="matchup-select">
      <span>左側チーム</span>
      <select id="matchupLeft"></select>
    </div>
    <div class="matchup-vs">VS</div>
    <div class="matchup-select">
      <span>右側チーム</span>
      <select id="matchupRight"></select>
    </div>
  </div>

  <div class="odai-card">
    <span class="odai-label">お題</span>
    <textarea id="odaiText" rows="2" placeholder="ここにお題を入力してください"></textarea>
  </div>

  <div class="arena">
    <section class="panel teamA" id="panelA">
      <div class="dmg-popup" id="popupA"></div>
      <div class="team-name" id="nameA">チームA</div>
      <div class="score-num" id="scoreA">20</div>
      <div class="hp-track"><div class="hp-fill" id="hpA" style="width:100%"></div></div>
      <div class="atk-label">攻撃力を選んで撃つ</div>
      <div class="atk-row" id="btnsA">
        <button class="atk-btn" data-power="0">0</button>
        <button class="atk-btn" data-power="1">1</button>
        <button class="atk-btn" data-power="2">2</button>
        <button class="atk-btn" data-power="3">3</button>
        <button class="atk-btn" data-power="4">4</button>
      </div>
    </section>

    <div class="vs-mark">VS</div>

    <section class="panel teamB" id="panelB">
      <div class="dmg-popup" id="popupB"></div>
      <div class="team-name" id="nameB">チームB</div>
      <div class="score-num" id="scoreB">20</div>
      <div class="hp-track"><div class="hp-fill" id="hpB" style="width:100%"></div></div>
      <div class="atk-label">攻撃力を選んで撃つ</div>
      <div class="atk-row" id="btnsB">
        <button class="atk-btn" data-power="0">0</button>
        <button class="atk-btn" data-power="1">1</button>
        <button class="atk-btn" data-power="2">2</button>
        <button class="atk-btn" data-power="3">3</button>
        <button class="atk-btn" data-power="4">4</button>
      </div>
    </section>
  </div>

  <div class="log-wrap">
    <div class="log-title">バトルログ</div>
    <ul id="log" aria-live="polite"></ul>
  </div>

  <div class="overlay" id="overlay">
    <div class="win-card">
      <div class="win-label">WINNER</div>
      <div class="win-name" id="winName">チームA</div>
      <button id="playAgainBtn" type="button">もう一度あそぶ</button>
    </div>
  </div>

<script>
(function(){
  const rosterKeys = ['A','B','C','D','E'];
  const roster = { A:'チームA', B:'チームB', C:'チームC', D:'チームD', E:'ドア'};
  const slotTeam = { A:'A', B:'B' }; // 左パネル(A)・右パネル(B)にどのロースターチームが入っているか

  let defaultScore = 20;
  let scoreA = defaultScore;
  let scoreB = defaultScore;
  let gameOver = false;
  let history = [];

  const scoreAEl = document.getElementById('scoreA');
  const scoreBEl = document.getElementById('scoreB');
  const hpAEl = document.getElementById('hpA');
  const hpBEl = document.getElementById('hpB');
  const panelA = document.getElementById('panelA');
  const panelB = document.getElementById('panelB');
  const popupA = document.getElementById('popupA');
  const popupB = document.getElementById('popupB');
  const nameAEl = document.getElementById('nameA');
  const nameBEl = document.getElementById('nameB');
  const logEl = document.getElementById('log');
  const overlay = document.getElementById('overlay');
  const winName = document.getElementById('winName');
  const initScoreInput = document.getElementById('initScore');
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel = document.getElementById('settingsPanel');
  const undoBtn = document.getElementById('undoBtn');
  const matchupLeft = document.getElementById('matchupLeft');
  const matchupRight = document.getElementById('matchupRight');

  function clamp(v){ return Math.max(0, v); }
  function slotName(slot){ return roster[slotTeam[slot]]; }

  function buildSelectOptions(select, otherSelect){
    select.innerHTML = '';
    rosterKeys.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = roster[k];
      select.appendChild(opt);
    });
  }

  function refreshSelects(){
    buildSelectOptions(matchupLeft);
    buildSelectOptions(matchupRight);
    matchupLeft.value = slotTeam.A;
    matchupRight.value = slotTeam.B;
    // 同じチーム同士を選べないよう、相手側で選択中のチームを無効化
    Array.from(matchupLeft.options).forEach(o => o.disabled = (o.value === slotTeam.B));
    Array.from(matchupRight.options).forEach(o => o.disabled = (o.value === slotTeam.A));
  }

  function updatePanelNames(){
    nameAEl.textContent = slotName('A');
    nameBEl.textContent = slotName('B');
  }

  function render(){
    scoreAEl.textContent = scoreA;
    scoreBEl.textContent = scoreB;
    hpAEl.style.width = Math.round((scoreA/defaultScore)*100) + '%';
    hpBEl.style.width = Math.round((scoreB/defaultScore)*100) + '%';
  }

  function addLog(attackerName, attackerSlot, power, dice, damage, defenderName){
    const li = document.createElement('li');
    li.classList.add(attackerSlot === 'A' ? 'from-a' : 'from-b');

    const nameSpan = document.createElement('span');
    nameSpan.className = 'log-name ' + (attackerSlot === 'A' ? 'teamA-text' : 'teamB-text');
    nameSpan.textContent = attackerName;
    li.appendChild(nameSpan);

    const plain1 = document.createElement('span');
    plain1.className = 'log-plain';
    plain1.textContent = '威力';
    li.appendChild(plain1);

    const powerSpan = document.createElement('span');
    powerSpan.className = 'log-power';
    powerSpan.textContent = power;
    li.appendChild(powerSpan);

    const plain2 = document.createElement('span');
    plain2.className = 'log-plain';
    plain2.textContent = '×  目';
    li.appendChild(plain2);

    const diceSpan = document.createElement('span');
    diceSpan.className = 'log-dice';
    diceSpan.textContent = dice;
    li.appendChild(diceSpan);

    const plain3 = document.createElement('span');
    plain3.className = 'log-plain';
    plain3.textContent = '=';
    li.appendChild(plain3);

    const totalSpan = document.createElement('span');
    totalSpan.className = 'log-total';
    totalSpan.textContent = damage + 'ダメージ';
    li.appendChild(totalSpan);

    const arrow = document.createElement('span');
    arrow.className = 'log-arrow';
    arrow.textContent = '→';
    li.appendChild(arrow);

    const defSpan = document.createElement('span');
    defSpan.className = 'log-name ' + (attackerSlot === 'A' ? 'teamB-text' : 'teamA-text');
    defSpan.textContent = defenderName;
    li.appendChild(defSpan);

    logEl.insertBefore(li, logEl.firstChild);
  }

  function showDamagePopup(popupEl, power, dice, damage){
    popupEl.innerHTML =
      '<span class="calc">威力<span class="p-power">' + power + '</span> × 目<span class="p-dice">' + dice + '</span></span>' +
      '<span class="total">' + damage + 'ダメージ！</span>';
    popupEl.classList.remove('show');
    void popupEl.offsetWidth;
    popupEl.classList.add('show');
  }

  function setButtonsDisabled(disabled){
    document.querySelectorAll('.atk-btn').forEach(b => b.disabled = disabled);
  }

  function flashPanel(panel){
    panel.classList.remove('flash');
    void panel.offsetWidth;
    panel.classList.add('flash');
  }

  function declareWinner(name){
    gameOver = true;
    setButtonsDisabled(true);
    winName.textContent = name + ' の勝利！';
    overlay.classList.add('show');
  }

  function updateUndoButton(){
    undoBtn.disabled = history.length === 0;
  }

  function attack(attacker, power){
    if (gameOver) return;
    const dice = 100;
    const damage = power * dice;
    const attackerName = slotName(attacker);
    const defenderName = attacker === 'A' ? slotName('B') : slotName('A');

    history.push({ scoreA, scoreB, gameOver });

    if (attacker === 'A'){
      scoreB = clamp(scoreB - damage);
      flashPanel(panelB);
      showDamagePopup(popupB, power, dice, damage);
    } else {
      scoreA = clamp(scoreA - damage);
      flashPanel(panelA);
      showDamagePopup(popupA, power, dice, damage);
    }

    addLog(attackerName, attacker, power, dice, damage, defenderName);
    render();
    updateUndoButton();

    if (scoreA === 0 || scoreB === 0){
      const winner = scoreB === 0 ? slotName('A') : slotName('B');
      declareWinner(winner);
    }
  }

  function undoLast(){
    if (history.length === 0) return;
    const prev = history.pop();
    scoreA = prev.scoreA;
    scoreB = prev.scoreB;
    gameOver = prev.gameOver;
    if (logEl.firstChild) logEl.removeChild(logEl.firstChild);
    overlay.classList.remove('show');
    popupA.classList.remove('show');
    popupB.classList.remove('show');
    setButtonsDisabled(gameOver);
    render();
    updateUndoButton();
  }

  document.getElementById('btnsA').addEventListener('click', e => {
    const btn = e.target.closest('.atk-btn');
    if (!btn) return;
    attack('A', Number(btn.dataset.power));
  });
  document.getElementById('btnsB').addEventListener('click', e => {
    const btn = e.target.closest('.atk-btn');
    if (!btn) return;
    attack('B', Number(btn.dataset.power));
  });

  function resetGame(){
    const v = parseInt(initScoreInput.value, 10);
    defaultScore = (!isNaN(v) && v > 0) ? v : 20;
    initScoreInput.value = defaultScore;
    scoreA = defaultScore;
    scoreB = defaultScore;
    gameOver = false;
    history = [];
    logEl.innerHTML = '';
    overlay.classList.remove('show');
    popupA.classList.remove('show');
    popupB.classList.remove('show');
    setButtonsDisabled(false);
    render();
    updateUndoButton();
  }

  document.getElementById('resetBtn').addEventListener('click', resetGame);
  document.getElementById('playAgainBtn').addEventListener('click', resetGame);
  undoBtn.addEventListener('click', undoLast);
  settingsToggle.addEventListener('click', () => settingsPanel.classList.toggle('open'));

  // チーム名編集
  document.querySelectorAll('.roster-input').forEach(input => {
    input.addEventListener('input', () => {
      const key = input.dataset.team;
      roster[key] = input.value.trim() || ('チーム' + key);
      updatePanelNames();
      refreshSelects();
    });
  });

  // 対戦カード選択
  matchupLeft.addEventListener('change', () => {
    slotTeam.A = matchupLeft.value;
    refreshSelects();
    updatePanelNames();
    resetGame();
  });
  matchupRight.addEventListener('change', () => {
    slotTeam.B = matchupRight.value;
    refreshSelects();
    updatePanelNames();
    resetGame();
  });

  refreshSelects();
  updatePanelNames();
  render();
  updateUndoButton();
})();
</script>

</body>
</html>
