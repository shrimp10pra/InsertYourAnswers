<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>得点表 | 4チーム対抗戦</title>
<meta name="description" content="4チーム対抗戦の得点をリアルタイムで集計する得点表">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<header class="site-header">
  <div class="header-row">
    <div>
      <h1>得点表</h1>
      <p class="subtitle">4チーム対抗戦・全5企画</p>
    </div>
    <button id="resetBtn" class="btn btn-ghost" type="button">記録をリセット</button>
  </div>
</header>

<main>

  <section class="standings" aria-labelledby="standings-heading">
    <h2 id="standings-heading">総合順位</h2>
    <div class="standings-grid" id="standingsGrid"></div>
  </section>

  <section class="bars" aria-labelledby="bars-heading">
    <h2 id="bars-heading">得点比較</h2>
    <div class="bars-list" id="barsList"></div>
  </section>

  <section class="team-names" aria-labelledby="names-heading">
    <h2 id="names-heading">チーム名</h2>
    <div class="names-grid" id="namesGrid"></div>
  </section>

  <section class="events" aria-labelledby="events-heading">
    <h2 id="events-heading">得点入力</h2>
    <div id="eventsContainer"></div>
  </section>

  <section class="breakdown" aria-labelledby="breakdown-heading">
    <h2 id="breakdown-heading">得点表（内訳）</h2>
    <div class="table-scroll">
      <table id="breakdownTable"></table>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p>順位ポイントが同点になった場合は、該当順位の点数を平均して割り当てます（例：1位が2チーム同点の場合、25pt と 20pt の平均 22.5pt を両チームに付与）。入力内容はこの端末のブラウザ内にのみ保存され、他の端末とは共有されません。</p>
</footer>

<script src="script.js"></script>
</body>
</html>
